<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff7f5"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>宮縮計時器</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff7f5;color:#382d35;margin:0;padding:24px 16px}main{max-width:500px;margin:auto}h1{text-align:center;font-size:26px}.panel{background:white;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 2px 15px #eadbdc66}.clock{text-align:center;font-size:64px;font-weight:750;font-variant-numeric:tabular-nums;margin:24px 0}.status{text-align:center;color:#846e7b}.primary{width:100%;border:0;border-radius:16px;background:#14846b;color:white;font-size:21px;font-weight:700;padding:21px}.primary.active{background:#c34c53}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{text-align:center}.stat strong{display:block;font-size:26px;margin-top:8px}.small{font-size:13px;color:#786a73}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}button{cursor:pointer}.undo{border:1px solid #d9cbd0;border-radius:10px;background:white;padding:10px;color:#654d5b}.undo:disabled{opacity:.35}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:12px 3px;text-align:left;border-bottom:1px solid #f0e7ea}th{color:#867882}footer{text-align:center;font-size:12px;color:#786a73;line-height:1.6;margin-top:18px}</style></head><body><main><h1>宮縮計時器</h1><section class="panel"><div class="status" id="status">準備開始記錄</div><div class="clock" id="clock">00:00</div><button class="primary" id="main">開始宮縮</button><p class="small" style="text-align:center" id="hint">感覺宮縮開始時按一下</p></section><div class="stats"><section class="panel stat"><span class="small">上一筆時長</span><strong id="last">—</strong></section><section class="panel stat"><span class="small">最近開始間隔</span><strong id="gap">—</strong></section></div><section class="panel"><div class="head"><h3>宮縮紀錄 <span id="count"></span></h3><button class="undo" id="undo">清除上一筆</button></div><div style="overflow-x:auto"><table><thead><tr><th>次數</th><th>開始時間</th><th>持續時長</th><th>開始間隔</th></tr></thead><tbody id="rows"></tbody></table></div><p class="small" id="empty">尚無紀錄</p></section><footer>資料只儲存在本機瀏覽器。請勿使用無痕模式或清除網站資料。<br>破水、陰道大量出血、胎動減少或持續劇痛時，請立即聯絡產房，不要等待計時結果。</footer></main><script>const $=id=>document.getElementById(id),KEY='contractions_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{records:[],started:null}}catch{state={records:[],started:null}}if(!Array.isArray(state.records))state.records=[];const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const fmt=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};const time=t=>new Date(t).toLocaleTimeString('zh-TW',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'});function render(){const r=state.records,last=r.at(-1),active=state.started!==null;$('clock').textContent=active?fmt(Date.now()-state.started):last?fmt(last.end-last.start):'00:00';$('status').textContent=active?'宮縮進行中':last?'本次宮縮已記錄':'準備開始記錄';$('main').textContent=active?'結束宮縮':last?'開始下一次宮縮':'開始宮縮';$('main').classList.toggle('active',active);$('hint').textContent=active?'感覺宮縮結束時再按一下':'感覺宮縮開始時按一下';$('last').textContent=last?fmt(last.end-last.start):'—';$('gap').textContent=r.length>1?fmt(r.at(-1).start-r.at(-2).start):'—';$('count').textContent='('+r.length+'筆)';$('undo').disabled=!r.length;$('empty').hidden=!!r.length;$('rows').replaceChildren();r.forEach((x,i)=>{const tr=document.createElement('tr');[i+1,time(x.start),fmt(x.end-x.start),i?fmt(x.start-r[i-1].start):'—'].forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});$('rows').prepend(tr)})} $('main').onclick=()=>{if(state.started===null){state.started=Date.now()}else{const end=Date.now();state.records.push({start:state.started,end});state.started=null}save();render()};$('undo').onclick=()=>{if(state.records.length&&confirm('確定清除上一筆宮縮紀錄？')){state.records.pop();save();render()}};render();setInterval(()=>{if(state.started!==null)$('clock').textContent=fmt(Date.now()-state.started)},250);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
