<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17243c"><title>商品比較收藏</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#17243c;background:#f5f7fb}*{box-sizing:border-box}body{margin:0}header{background:#17243c;color:white;padding:calc(18px + env(safe-area-inset-top)) 18px 18px}h1{font-size:22px;margin:0 0 5px}header small{color:#c8d4e5}main{padding:16px;max-width:900px;margin:auto}.panel{background:white;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #1c2d4b0c}h2{font-size:17px;margin:0 0 12px}label{display:block;font-size:13px;color:#59667b;margin:10px 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #d9e0eb;border-radius:11px;background:white;font:inherit;font-size:16px}button{border:0;border-radius:11px;padding:11px 14px;background:#233b64;color:white;font:inherit;font-weight:600;cursor:pointer}button.secondary{background:#eaf0f8;color:#243b61}button.danger{background:#fce8e8;color:#9c2626}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.muted{font-size:12px;color:#718096}.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.chip{white-space:nowrap;background:#eaf0f8;color:#233b64}.chip.active{background:#233b64;color:white}.cards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 1px 15px}.product{min-width:82%;max-width:82%;scroll-snap-align:center;border:1px solid #e5eaf2;border-radius:16px;padding:13px;background:white}.product img{width:100%;height:210px;object-fit:contain;border-radius:12px;background:#f5f7fa}.product h3{font-size:16px;margin:10px 0 5px}.price{font-size:23px;font-weight:800;color:#c34248}.details{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.hidden{display:none!important}.empty{padding:30px 5px;text-align:center;color:#8290a3}.tag{font-size:12px;background:#f0f4f9;border-radius:7px;padding:4px 7px}a{color:#2459a0;overflow-wrap:anywhere}dialog{border:0;border-radius:18px;width:calc(100% - 26px);max-width:520px;max-height:85vh;overflow:auto;padding:18px}dialog::backdrop{background:#101a2c99}.compare{overflow-x:auto}table{border-collapse:collapse;font-size:13px;min-width:100%}td,th{border:1px solid #e1e6ee;padding:9px;min-width:125px;vertical-align:top}th{background:#f0f4fa}nav{position:sticky;bottom:0;background:#ffffffef;backdrop-filter:blur(8px);display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid #e4e9f0}nav button{flex:1} @media(min-width:650px){.product{min-width:300px;max-width:300px}}
</style></head><body><header><h1>商品比較收藏</h1><small>Product Comparison Manager · 手機本機版</small></header><main><section class="panel"><h2>商品分類</h2><div class="chips" id="categories"></div><div class="actions"><button class="secondary" id="addCat">＋ 新增分類</button><button class="secondary" id="renameCat">修改分類</button><button class="danger" id="delCat">刪除分類</button></div></section><section class="panel"><h2>商品群組</h2><div class="chips" id="groups"></div><div class="actions"><button class="secondary" id="addGroup">＋ 新增群組</button><button class="secondary" id="renameGroup">修改群組</button><button class="danger" id="delGroup">刪除群組</button></div></section><section class="panel"><div class="row" style="align-items:center"><h2 style="flex:1" id="groupTitle">商品比較</h2><button id="addProduct">＋ 加入商品</button></div><p class="muted">左右滑動查看不同品牌，點選「規格比較」可並排查看。</p><div class="cards" id="cards"></div><div class="actions"><button class="secondary" id="compareBtn">規格比較</button></div></section><section class="panel"><h2>資料備份</h2><p class="muted">資料只保存在此瀏覽器的本機儲存空間。請定期匯出備份，清除網站資料可能導致收藏消失。</p><div class="actions"><button class="secondary" id="exportBtn">匯出 JSON</button><button class="secondary" id="importBtn">匯入 JSON</button><input id="importFile" type="file" accept="application/json,.json" hidden></div></section></main><nav><button id="navAdd">＋ 收藏商品</button><button class="secondary" id="navCompare">查看比較</button></nav><dialog id="editor"><form id="productForm"><h2 id="editTitle">新增商品</h2><label>商品分類</label><select id="editCat" required></select><label>商品群組</label><select id="editGroup" required></select><label>MOMO 商品網址（支援分享連結）</label><input id="url" type="url" placeholder="https://momo.dm/..."><div class="actions"><button type="button" class="secondary" id="pasteBtn">貼上剪貼簿網址</button></div><label>品牌</label><input id="brand" placeholder="例如 mamaway"><label>商品名稱 *</label><input id="name" required><div class="row"><div><label>價格 NT$</label><input id="price" type="number" min="0" step="1"></div><div><label>個人評分（0–5）</label><input id="rating" type="number" min="0" max="5" step="0.5"></div></div><label>圖片網址（選填）</label><input id="image" type="url" placeholder="https://..."><label>商品規格（每行一項：名稱:內容）</label><textarea id="specs" rows="4" placeholder="材質: 棉\n尺寸: M/L"></textarea><label>備註</label><textarea id="notes" rows="2"></textarea><div class="actions"><button type="button" class="secondary" id="cancelEdit">取消</button><button type="submit">儲存商品</button></div></form></dialog><dialog id="compareDialog"><h2>詳細規格比較</h2><div id="comparison" class="compare"></div><div class="actions"><button class="secondary" id="closeCompare">關閉</button></div></dialog><script>
'use strict';const KEY='pcm_mobile_v1';const $=id=>document.getElementById(id);const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();const initial=()=>({categories:[{id:'c1',name:'孕產用品'},{id:'c2',name:'嬰兒用品'},{id:'c3',name:'家電用品'}],groups:[{id:'g1',categoryId:'c1',name:'托腹帶'},{id:'g2',categoryId:'c2',name:'奶瓶'},{id:'g3',categoryId:'c3',name:'淨水器'}],products:[]});let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()}let categoryId=db.categories[0]?.id||'',groupId=db.groups.find(g=>g.categoryId===categoryId)?.id||'',editing=null;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('儲存失敗：瀏覽器空間不足，請先匯出備份。')}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const validHttp=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};const groups=()=>db.groups.filter(g=>g.categoryId===categoryId);const products=()=>db.products.filter(p=>p.groupId===groupId);function render(){if(!db.categories.some(c=>c.id===categoryId))categoryId=db.categories[0]?.id||'';if(!groups().some(g=>g.id===groupId))groupId=groups()[0]?.id||'';$('categories').innerHTML=db.categories.map(c=>`<button class="chip ${c.id===categoryId?'active':''}" data-cat="${esc(c.id)}">${esc(c.name)}</button>`).join('')||'<span class="muted">請先新增分類</span>';$('groups').innerHTML=groups().map(g=>`<button class="chip ${g.id===groupId?'active':''}" data-group="${esc(g.id)}">${esc(g.name)}</button>`).join('')||'<span class="muted">請先新增群組</span>';$('groupTitle').textContent=db.groups.find(g=>g.id===groupId)?.name||'商品比較';$('cards').innerHTML=products().map(p=>`<article class="product">${validHttp(p.image)?`<img src="${esc(validHttp(p.image))}" alt="商品圖片" loading="lazy" referrerpolicy="no-referrer">`:'<div class="empty">尚無商品圖片</div>'}<h3>${esc(p.name)}</h3><span class="tag">${esc(p.brand||'未填品牌')}</span><p class="price">${p.price!==''&&p.price!=null?'NT$ '+Number(p.price).toLocaleString('zh-TW'):'價格未填'}</p><p class="details">${esc(p.specs||'尚未填寫規格')}</p><p class="muted">${esc(p.notes||'')} ${p.rating!==''&&p.rating!=null?' · 評分 '+esc(p.rating):''}</p>${validHttp(p.url)?`<a href="${esc(validHttp(p.url))}" target="_blank" rel="noopener noreferrer">開啟 MOMO 商品頁</a>`:''}<div class="actions"><button class="secondary" data-edit="${esc(p.id)}">編輯</button><button class="danger" data-delete="${esc(p.id)}">刪除</button></div></article>`).join('')||'<div class="empty">尚未收藏商品，點選「加入商品」開始</div>';save()};document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.cat){categoryId=b.dataset.cat;groupId='';render()}if(b.dataset.group){groupId=b.dataset.group;render()}if(b.dataset.edit)openEditor(b.dataset.edit);if(b.dataset.delete&&confirm('確定刪除此商品？')){db.products=db.products.filter(p=>p.id!==b.dataset.delete);render()}});function ask(label,old=''){const s=prompt(label,old);return s===null?null:s.trim()};$('addCat').onclick=()=>{const name=ask('新增分類名稱');if(name){const c={id:uid(),name};db.categories.push(c);categoryId=c.id;groupId='';render()}};$('renameCat').onclick=()=>{const c=db.categories.find(c=>c.id===categoryId);if(!c)return;const s=ask('修改分類名稱',c.name);if(s){c.name=s;render()}};$('delCat').onclick=()=>{if(!categoryId||!confirm('刪除分類及其中所有群組、商品？'))return;const ids=db.groups.filter(g=>g.categoryId===categoryId).map(g=>g.id);db.products=db.products.filter(p=>!ids.includes(p.groupId));db.groups=db.groups.filter(g=>g.categoryId!==categoryId);db.categories=db.categories.filter(c=>c.id!==categoryId);render()};$('addGroup').onclick=()=>{if(!categoryId)return alert('請先新增分類');const name=ask('新增商品群組名稱');if(name){const g={id:uid(),categoryId,name};db.groups.push(g);groupId=g.id;render()}};$('renameGroup').onclick=()=>{const g=db.groups.find(g=>g.id===groupId);if(!g)return;const s=ask('修改群組名稱',g.name);if(s){g.name=s;render()}};$('delGroup').onclick=()=>{if(!groupId||!confirm('刪除此群組及其中所有商品？'))return;db.products=db.products.filter(p=>p.groupId!==groupId);db.groups=db.groups.filter(g=>g.id!==groupId);render()};function populateGroups(cat,selected){$('editGroup').innerHTML=db.groups.filter(g=>g.categoryId===cat).map(g=>`<option value="${esc(g.id)}" ${g.id===selected?'selected':''}>${esc(g.name)}</option>`).join('')};function openEditor(id=null){if(!db.groups.length)return alert('請先新增商品分類及群組');editing=id;const p=db.products.find(x=>x.id===id)||{};$('productForm').reset();$('editTitle').textContent=id?'編輯商品':'新增商品';const cat=p.groupId?db.groups.find(g=>g.id===p.groupId)?.categoryId:categoryId;$('editCat').innerHTML=db.categories.map(c=>`<option value="${esc(c.id)}" ${c.id===cat?'selected':''}>${esc(c.name)}</option>`).join('');populateGroups(cat,p.groupId||groupId);for(const f of ['url','brand','name','price','rating','image','specs','notes'])$(f).value=p[f]??'';if(!id){const params=new URLSearchParams(location.search);const shared=params.get('url')||params.get('text')||params.get('shared')||'';const match=shared.match(/https?:\/\/[^\s]+/);if(match)$('url').value=match[0];if(params.get('title'))$('name').value=params.get('title')}$('editor').showModal()};$('editCat').onchange=e=>populateGroups(e.target.value);$('cancelEdit').onclick=()=>$('editor').close();$('pasteBtn').onclick=async()=>{try{$('url').value=await navigator.clipboard.readText()}catch{alert('無法直接讀取剪貼簿，請長按輸入框貼上')}};$('productForm').onsubmit=e=>{e.preventDefault();const groupIdNew=$('editGroup').value;if(!groupIdNew)return alert('請選擇商品群組');const url=$('url').value.trim(),image=$('image').value.trim();if(url&&!validHttp(url))return alert('請輸入有效網址');if(image&&!validHttp(image))return alert('請輸入有效圖片網址');const p={id:editing||uid(),groupId:groupIdNew,...Object.fromEntries(['url','brand','name','price','rating','image','specs','notes'].map(f=>[f,$(f).value.trim()]))};if(editing){db.products=db.products.map(x=>x.id===editing?p:x)}else db.products.push(p);categoryId=db.groups.find(g=>g.id===groupIdNew).categoryId;groupId=groupIdNew;$('editor').close();render();history.replaceState(null,'',location.pathname)};$('addProduct').onclick=()=>openEditor();$('navAdd').onclick=()=>openEditor();function compare(){const pp=products();if(!pp.length)return alert('請先加入商品');const keys=new Set;pp.forEach(p=>(p.specs||'').split('\n').forEach(line=>{const i=line.indexOf(':')>=0?line.indexOf(':'):line.indexOf('：');if(i>0)keys.add(line.slice(0,i).trim())}));const rows=[['品牌',p=>p.brand],['價格',p=>p.price!==''?'NT$ '+p.price:''],['評分',p=>p.rating],...Array.from(keys).map(k=>[k,p=>(p.specs||'').split('\n').map(l=>{const i=l.search(/[:：]/);return i>=0?[l.slice(0,i).trim(),l.slice(i+1).trim()]:[]}).find(a=>a[0]===k)?.[1]||'']),['備註',p=>p.notes]];$('comparison').innerHTML=`<table><thead><tr><th>項目</th>${pp.map(p=>`<th>${esc(p.name)}</th>`).join('')}</tr></thead><tbody>${rows.map(([k,fn])=>`<tr><th>${esc(k)}</th>${pp.map(p=>`<td>${esc(fn(p)||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table>`;$('compareDialog').showModal()};$('compareBtn').onclick=compare;$('navCompare').onclick=compare;$('closeCompare').onclick=()=>$('compareDialog').close();$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,...db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Product_Comparison_Backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data.categories)||!Array.isArray(data.groups)||!Array.isArray(data.products))throw Error('檔案格式不正確');if(!confirm('匯入將覆蓋目前所有商品資料，確定繼續？'))return;db={categories:data.categories,groups:data.groups,products:data.products};categoryId='';groupId='';render();alert('匯入完成')}catch(err){alert('匯入失敗：'+err.message)}e.target.value=''};render();if(new URLSearchParams(location.search).has('url')||new URLSearchParams(location.search).has('text'))setTimeout(()=>openEditor(),150);
</script></body></html>
